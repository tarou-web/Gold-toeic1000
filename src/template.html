<title>TOEICフレーズ1000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: playful lesson app — stat pills on top, one chunky 3D card or quiz in the middle, settings at the bottom */
:root{
  --bg:#ffffff; --bg2:#f7f7f7; --surface:#ffffff; --fg:#3c3c3c; --muted:#8a8a8a; --line:#e5e5e5; --line2:#cfcfcf;
  --green:#4cc21c; --green-d:#3a9a12; --green-s:#d9f7c4; --green-ink:#2f7d0c;
  --blue:#2fa8f0; --blue-d:#1d86c4; --blue-s:#dcf1fd; --blue-ink:#1673ad;
  --red:#f04a4a; --red-d:#c73434; --red-s:#ffe0e0; --red-ink:#d13636;
  --gold:#ffb21e; --gold-d:#e08f00;
  --f:"Nunito","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-jp:"M PLUS Rounded 1c","Nunito","Hiragino Maru Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131f24; --bg2:#1a2a31; --surface:#1d2d35; --fg:#eef3f5; --muted:#8fa3ad; --line:#37464f; --line2:#2a3a42;
  --green:#58d22a; --green-d:#3e9e16; --green-s:#1f3a1a; --green-ink:#7ee64f;
  --blue:#3fb6f7; --blue-d:#1f88c6; --blue-s:#16344a; --blue-ink:#7fd0fb;
  --red:#ff5a5a; --red-d:#c43a3a; --red-s:#3d2023; --red-ink:#ff8181;
  --gold:#ffc03d; --gold-d:#d99200; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131f24; --bg2:#1a2a31; --surface:#1d2d35; --fg:#eef3f5; --muted:#8fa3ad; --line:#37464f; --line2:#2a3a42;
  --green:#58d22a; --green-d:#3e9e16; --green-s:#1f3a1a; --green-ink:#7ee64f;
  --blue:#3fb6f7; --blue-d:#1f88c6; --blue-s:#16344a; --blue-ink:#7fd0fb;
  --red:#ff5a5a; --red-d:#c43a3a; --red-s:#3d2023; --red-ink:#ff8181;
  --gold:#ffc03d; --gold-d:#d99200; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:700;font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* header stats */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-jp);font-weight:800;font-size:1.3rem;letter-spacing:.01em}
h1 span{color:var(--green)}
.stats{display:flex;gap:14px;font-family:var(--f);font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:5px}
.stat.fire{color:var(--gold-d)} .stat.xp{color:var(--blue)} .stat.know{color:var(--green)}
.stat svg{width:22px;height:22px}
.track{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.track i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.3,1.3,.5,1);position:relative}
.track i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.tracklabel{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:-10px}

/* tabs as chunky segmented buttons */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{font:inherit;font-family:var(--f-jp);font-weight:800;font-size:.92rem;padding:10px 6px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{border-color:var(--blue);background:var(--blue-s);color:var(--blue-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,.scene:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--green-s);color:var(--green-ink)} .chip.bad{background:var(--red-s);color:var(--red-ink)} .chip.new{background:var(--bg2);color:var(--muted);border:2px solid var(--line)}
.pill{font:inherit;font-weight:800;font-size:.8rem;padding:6px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--blue);cursor:pointer}
.pill:active{transform:translateY(2px);border-bottom-width:2px}

/* 3D flip card */
.scene{perspective:1400px;cursor:pointer;border-radius:22px}
.flip{position:relative;height:min(52vh,320px);min-height:250px;transform-style:preserve-3d}
.flip.turned{transform:rotateY(180deg)}
.flip.instant,.flip.instant .face{transition:none}
/* swap visibility at the half-turn so the reverse side never shows through (Safari ignores backface-visibility on some children) */
.flip.showback .front,.flip:not(.showback) .back{visibility:hidden}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:46px 24px 42px;text-align:center;overflow:hidden}
.front{transform:translateZ(1px);background:var(--surface);border:2px solid var(--line);border-bottom-width:6px}
.back{transform:rotateY(180deg) translateZ(1px);background:var(--blue);border:2px solid var(--blue-d);border-bottom-width:6px;color:#fff}
.back::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);right:-70px;top:-90px}
.back::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);left:-50px;bottom:-60px}
.face .corner{position:absolute;top:14px;left:18px;font-size:.75rem;color:var(--muted);font-weight:800}
.back .corner{color:rgba(255,255,255,.8)}
.face .side{position:absolute;top:12px;right:16px;font-size:.7rem;font-weight:900;letter-spacing:.08em;padding:3px 10px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.back .side{background:rgba(255,255,255,.2);color:#fff}
.face .tap{position:absolute;bottom:14px;left:0;right:0;font-size:.75rem;color:var(--muted)}
.back .tap{color:rgba(255,255,255,.75)}
.txt{position:relative;z-index:1;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.txt.jp{font-family:var(--f-jp);font-weight:800;font-size:clamp(1.3rem,4.6vw,1.75rem);line-height:1.45}
.txt.en{font-family:var(--f);font-weight:900;font-size:clamp(1.4rem,5vw,2rem);line-height:1.25}
.fixnote{position:relative;z-index:1;font-size:.72rem;opacity:.8}
.front .fixnote{color:var(--muted)}
.say{position:relative;z-index:1;font:inherit;font-weight:800;font-size:.85rem;border:2px solid rgba(255,255,255,.5);border-bottom-width:4px;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:6px 16px;cursor:pointer}
.say:active{transform:translateY(2px);border-bottom-width:2px}
.front .say{border-color:var(--line);background:var(--surface);color:var(--blue)}

/* chunky buttons */
.row{display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.btn{font:inherit;font-family:var(--f-jp);font-weight:800;font-size:1rem;letter-spacing:.04em;padding:13px 10px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);color:var(--muted);cursor:pointer;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.btn.ok{background:var(--green);border-color:var(--green-d);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--red);color:var(--red-ink)}
.btn.blue{background:var(--surface);border-color:var(--line);color:var(--blue)}
.btn.red{background:var(--red);border-color:var(--red-d);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.keys{font-size:.72rem;color:var(--muted);text-align:center}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .track{flex:1}
.qhead .score{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ask{font-family:var(--f-jp);font-weight:800;font-size:1.25rem;margin:4px 0 0}
.bubble{position:relative;display:flex;align-items:center;gap:12px}
.bubble .dot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--green-s);display:grid;place-items:center}
.bubble .dot svg{width:30px;height:30px}
.bubble .say-box{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.bubble .say-box::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:800;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);color:var(--fg);cursor:pointer;line-height:1.4;display:flex;gap:12px;align-items:center}
.opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt.jp{font-family:var(--f-jp)}
.opt:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.opt.right{border-color:var(--green);background:var(--green-s);color:var(--green-ink)} .opt.right .k{border-color:var(--green);color:var(--green-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-s);color:var(--red-ink)} .opt.wrong .k{border-color:var(--red);color:var(--red-ink)}
.opt[disabled]{cursor:default}
.feedback{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.feedback.good{background:var(--green-s);color:var(--green-ink)}
.feedback.miss{background:var(--red-s);color:var(--red-ink)}
.feedback h3{margin:0;font-family:var(--f-jp);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.feedback h3 svg{width:30px;height:30px;flex:0 0 auto}
.feedback p{margin:0;font-size:.95rem}
.feedback .row2 .btn.blue{border-color:transparent}
@keyframes pop{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.25,.5,1);border-top:2px solid transparent}
.sheet.show{transform:none}
.sheet.good{background:var(--green-s);border-color:var(--green);color:var(--green-ink)}
.sheet.miss{background:var(--red-s);border-color:var(--red);color:var(--red-ink)}
.sheet .in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.sheet .msg{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:14px}
.sheet .badge{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.sheet .badge svg{width:40px;height:40px}
.sheet.good .badge{color:var(--green)} .sheet.miss .badge{color:var(--red)}
.sheet h3{margin:0;font-family:var(--f-jp);font-weight:800;font-size:1.35rem;line-height:1.3}
.sheet p{margin:2px 0 0;font-weight:800}
.sheet .acts{flex:1 1 220px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.sheet .acts .btn.blue{background:transparent;border-color:currentColor;color:inherit}
body.sheet-open .wrap{padding-bottom:200px}
.opt.right{animation:hop .4s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{animation:shake .4s}
@keyframes hop{40%{transform:translateY(-6px) scale(1.02)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* card judgement flash */
.scene{position:relative}
.scene.judge-ok .face{border-color:var(--green)!important;background:var(--green-s)!important;color:var(--green-ink)}
.scene.judge-ng .face{border-color:var(--red)!important;background:var(--red-s)!important;color:var(--red-ink)}
.scene.judge-ok .face *,.scene.judge-ng .face *{color:inherit!important}
.scene.judge-ok .back::before,.scene.judge-ok .back::after,.scene.judge-ng .back::before,.scene.judge-ng .back::after{opacity:0}
.scene.judge-ng{animation:shake .4s}
.scene.judge-ok{animation:joy .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes joy{0%{transform:none}25%{transform:translateY(-16px) scale(1.03)}50%{transform:translateY(0) scale(1.03,.97)}70%{transform:translateY(-5px) scale(.99,1.01)}100%{transform:none}}
.spark{position:absolute;left:50%;top:50%;z-index:6;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:4px;pointer-events:none;animation:burst .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}
.stamp{position:absolute;left:50%;top:50%;z-index:5;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);transform:scale(0);opacity:0;pointer-events:none}
.stamp svg{width:72px;height:72px}
.scene.judge-ok .stamp{color:var(--green);animation:stamp .45s cubic-bezier(.3,1.7,.5,1) forwards}
.scene.judge-ng .stamp{color:var(--red);animation:stamp .45s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes stamp{to{transform:scale(1);opacity:1}}
.done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 10px;text-align:center}
.done h2{margin:0;font-family:var(--f-jp);font-weight:800;font-size:1.6rem;color:var(--gold-d)}
.done .boxes{display:grid;grid-template-columns:repeat(2,minmax(0,140px));gap:12px}
.done .box{border-radius:16px;border:2px solid var(--gold);overflow:hidden}
.done .box.g{border-color:var(--green)}
.done .box b{display:block;background:var(--gold);color:#fff;font-size:.75rem;padding:4px}
.done .box.g b{background:var(--green)}
.done .box span{display:block;padding:10px;font-size:1.4rem;font-weight:900}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

/* list */
input[type=search],select{font:inherit;font-weight:700;font-size:.92rem;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.list{border:2px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:3em 1fr auto;gap:4px 10px;padding:12px 14px;border-top:2px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item .n{font-size:.75rem;color:var(--muted);padding-top:4px}
.item .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.item .e{font-weight:900}
.item .j{font-family:var(--f-jp);font-weight:500;font-size:.88rem;color:var(--muted)}
.item .f{font-size:.7rem;color:var(--red-ink)}
.item button{background:none;border:0;cursor:pointer;padding:2px}
.more{text-align:center;padding:10px}

/* settings */
.controls{margin-top:6px;padding-top:18px;border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:560px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.ctl{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--muted);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.splash{position:fixed;inset:0;z-index:100;background:#9aa3ad;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:min(52vw,230px);height:auto;animation:sp-pop .6s cubic-bezier(.3,1.6,.5,1) both}
.splash .lids{transform-box:fill-box;transform-origin:center;animation:sp-blink 1.1s .55s ease-in-out both}
.splash .sname{position:absolute;left:0;right:0;bottom:calc(44px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-family:var(--f-jp);font-weight:800;font-size:1.9rem;letter-spacing:.04em}
.splash .sname span{font-family:var(--f);font-weight:900}
@keyframes sp-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sp-blink{0%,40%,60%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.splash svg,.splash .lids{animation:none}}
.stat.fire{font:inherit;font-weight:900;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:10px;cursor:pointer}
.stat.fire:active{transform:scale(.94)}
.sv{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .38s cubic-bezier(.3,1.1,.4,1);visibility:hidden}
.sv.open{transform:none;visibility:visible}
body.sv-lock{overflow:hidden}
.sv-hero{--hot:#f29100;--hot-d:#c96f00;background:var(--hot);color:#fff;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sv-hero{--hot:#d97b00;--hot-d:#a85c00}}
:root[data-theme="dark"] .sv-hero{--hot:#d97b00;--hot-d:#a85c00}
.sv-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sv-bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:12px}
.sv-bar h2{margin:0;text-align:center;font-family:var(--f-jp);font-weight:800;font-size:1.25rem}
.sv-x{width:44px;height:44px;border:0;background:none;color:#fff;font-size:1.8rem;line-height:1;cursor:pointer;border-radius:12px}
.sv-x:focus-visible{outline:3px solid #fff}
.sv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 30px}
.sv-num{font-family:var(--f);font-weight:900;font-size:5.4rem;line-height:1;color:#fff;text-shadow:0 0 0 var(--hot-d),5px 5px 0 var(--hot-d)}
.sv-lbl{font-family:var(--f-jp);font-weight:800;font-size:1.7rem;margin-top:6px}
.sv-sub{font-size:.88rem;opacity:.9;margin-top:4px}
.sv-flame{width:min(36vw,150px);flex:0 0 auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.sv-flame.cold{filter:grayscale(1) opacity(.55)}
.sv-flame.lit{animation:flick 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.sv-body{display:flex;flex-direction:column;gap:16px;padding-block:22px 48px}
.sv-mon{display:flex;align-items:center;justify-content:space-between}
.sv-mon h3{margin:0;font-family:var(--f-jp);font-weight:800;font-size:1.4rem}
.sv-nav{display:flex;gap:6px}
.sv-nav button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:900;cursor:pointer}
.sv-nav button:disabled{opacity:.3;cursor:default}
.sv-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sv-card{border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.sv-card b{display:block;font-size:1.35rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.sv-card small{display:block;color:var(--muted);font-size:.75rem;font-weight:700}
.sv-card .ic{flex:0 0 auto;width:30px;height:30px}
.sv-cal{border:2px solid var(--line);border-radius:20px;padding:14px 8px 10px}
.sv-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center;font-variant-numeric:tabular-nums}
.sv-grid .wd{font-size:.8rem;color:var(--muted);font-weight:800;padding-bottom:6px}
.sv-d{position:relative;height:42px;display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:.95rem}
.sv-d span{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.sv-d.on::before{content:"";position:absolute;top:3px;bottom:3px;left:50%;right:50%;background:#ffe2b3}

<script>
const DATA = __DATA__;
const KEY='toeic1000-v1';
let S={known:{},miss:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.known) S=s;}catch(e){}
S.xp=S.xp||0; S.streak=S.streak||0; S.days=S.days||{}; S.points=S.points||0; S.goal=S.goal||10; S.td=S.td||{d:'',pts:{},done:{}};
// fill in days from an existing streak recorded before the calendar existed
if(S.last&&!Object.keys(S.days).length){const [y,m,d]=S.last.split('-').map(Number);for(let i=0;i<Math.max(1,S.streak);i++){const x=new Date(y,m-1,d-i);S.days[dkey(x)]=1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};scheduleSync()}
// ---- cloud sync (Firebase Realtime Database, REST) ----
var FB_URL='https://phrase1000-default-rtdb.asia-southeast1.firebasedatabase.app'.replace(/\/+$/,'');
var FB_ON=/^https:\/\//.test(FB_URL);
function newKey(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
var syncTimer=null,syncBusy=false,syncDirty=false;
function syncPayload(){
  const td=todayState();
  return {points:S.points||0,goal:S.goal||10,todayKey:td.d,todayDone:Object.keys(td.done).length,todayPts:td.pts,todayDoneMap:td.done,streak:S.streak||0,last:S.last||'',xp:S.xp||0,known:S.known||{},miss:S.miss||{},days:S.days||{},
    knownCount:Object.keys(S.known||{}).length,total:DATA.length,updatedAt:Date.now(),tz:-new Date().getTimezoneOffset()};
}
function scheduleSync(){ if(!FB_ON||!S.syncKey)return; syncDirty=true; clearTimeout(syncTimer); syncTimer=setTimeout(pushSync,4000) }
async function pushSync(keepalive){
  if(!FB_ON||!S.syncKey||!syncDirty||syncBusy)return;
  syncBusy=true; syncDirty=false;
  try{
    const r=await fetch(`${FB_URL}/progress/${S.syncKey}.json`,{method:'PUT',body:JSON.stringify(syncPayload()),keepalive:!!keepalive,headers:{'Content-Type':'application/json'}});
    if(!r.ok)throw new Error(r.status);
    S.syncedAt=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    syncStatus();
  }catch(e){syncDirty=true; syncStatus('同期できませんでした。電波のある場所で開くと自動で再送します。')}
  finally{syncBusy=false}
}
function syncStatus(err){
  const el=$('syncSt'); if(!el)return;
  if(!FB_ON){el.textContent='クラウド同期はまだ設定されていません。';return}
  if(err){el.textContent=err;return}
  el.textContent=S.syncedAt?`最後に同期した時刻：${new Date(S.syncedAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`:'まだ同期していません。学習すると自動で送られます。';
}
function initSync(){
  if(!S.syncKey){S.syncKey=newKey();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  $('syncKey').value=S.syncKey; syncStatus();
  $('syncCopy').onclick=async()=>{try{await navigator.clipboard.writeText(S.syncKey);$('syncCopy').textContent='コピーしました'}catch(e){$('syncKey').select();$('syncCopy').textContent='選択しました'}setTimeout(()=>$('syncCopy').textContent='コピー',1800)};
  let armed=null;
  $('syncLoad').onclick=async()=>{
    const k=$('syncIn').value.trim().toLowerCase(), m=$('syncMsg'); m.className='sync-msg';
    if(!/^[0-9a-f]{32}$/.test(k)){m.textContent='合言葉は32文字の英数字です。コピーし直して貼り付けてください。';m.classList.add('bad');return}
    if(!FB_ON){m.textContent='クラウド同期がまだ設定されていません。';m.classList.add('bad');return}
    if(armed!==k){armed=k;$('syncLoad').textContent='上書きする';m.textContent='もう一度押すと、この端末の記録をその合言葉の記録で上書きします。';return}

function tone(c,type,freq,start,dur,vol){
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+0.01);
  g.gain.setValueAtTime(vol,start+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g).connect(c.destination);o.start(start);o.stop(start+dur+0.02);
}
function bell(c,f,start,dur,vol){
  // bright chime: fundamental + soft octave + a touch of fifth, fast attack, ringing decay
  [[1,1],[2,.35],[3,.12]].forEach(([m,g0])=>{
    const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0.0001,start);g.gain.exponentialRampToValueAtTime(vol*g0,start+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur*(m===1?1:.6));
    o.connect(g).connect(c.destination);o.start(start);o.stop(start+dur+0.05);
  });
}
function bwomp(c,f1,f2,start,dur,vol){
  // soft low tone that slides down, rounded off with a low-pass filter
  const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f1,start);o.frequency.exponentialRampToValueAtTime(f2,start+dur);
  lp.type='lowpass';lp.frequency.value=900;
  g.gain.setValueAtTime(0.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+0.02);
  g.gain.setValueAtTime(vol,start+dur*.55);g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(lp).connect(g).connect(c.destination);o.start(start);o.stop(start+dur+0.05);
}

      <div class="boxes"><div class="box"><b>正解</b><span>${qs.r}問</span></div><div class="box g"><b>正答率</b><span>${acc}%</span></div></div>
      <button class="btn ok" id="again" style="width:100%;max-width:320px">次のレッスンへ</button></div>`;
    fanfare(); $('again').onclick=()=>{startQuiz();renderQuiz()};return}
  const d=QP[qi], je=$('dir').value==='je';
  const others=DATA.filter(x=>x.id!==d.id);
  const opts=[d];while(opts.length<4){const o=others[Math.random()*others.length|0];if(!opts.includes(o)&&(je?o.en:o.jp)!==(je?d.en:d.jp))opts.push(o)}
  opts.sort(()=>Math.random()-.5);
  answered=false;
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
   <div class="qhead"><div class="track"><i style="width:${qi/QP.length*100}%"></i></div><span class="score">${qi+1} / ${QP.length}</span></div>
   <h2 class="ask">${je?'正しい英語を選んでください':'正しい意味を選んでください'}</h2>
   <div class="bubble"><div class="dot"><svg viewBox="0 0 24 24"><path fill="var(--green)" d="M4 5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-5 4v-4a2 2 0 0 1-2-2z"/></svg></div>
     <div class="say-box"><div class="txt ${je?'jp':'en'}" style="font-size:1.25rem">${esc(je?d.jp:d.en)}</div></div></div>
   <div class="opts">${opts.map((o,i)=>`<button class="opt ${je?'':'jp'}" data-id="${o.id}"><span class="k">${i+1}</span><span>${esc(je?o.en:o.jp)}</span></button>`).join('')}</div>
   </div>`;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,d,je));
}
function answer(b,d,je){
  if(answered) return; answered=true;
  const v=$('v-quiz'); const ok=+b.dataset.id===d.id; qs.n++;
  if(ok){qs.r++;qs.xp+=10;S.known[d.id]=1;studied(10);credit(d.id,false)}else{b.classList.add('wrong');S.miss[d.id]=(S.miss[d.id]||0)+1;delete S.known[d.id]}
  v.querySelector(`.opt[data-id="${d.id}"]`).classList.add('right');
  v.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  sfx(ok); buzz(ok); save(); header();
  showSheet(ok,ok?CHEER[Math.random()*CHEER.length|0]:'不正解',ok?'':`正解：${esc(je?d.en:d.jp)}`,d);
}
function showSheet(ok,title,sub,d){
  const sh=$('sheet');
  sh.className='sheet '+(ok?'good':'miss');
  $('sheetin').innerHTML=`<div class="msg"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div></div>
    <div class="acts"><button class="btn blue" id="qsay">🔊</button><button class="btn ${ok?'ok':'red'}" id="qnext">続ける</button></div>`;
  void sh.offsetWidth; sh.classList.add('show'); document.body.classList.add('sheet-open');
  $('qsay').onclick=()=>speak(d.en);
  const n=$('qnext'); n.onclick=()=>{hideSheet();qi++;renderQuiz()}; n.focus({preventScroll:true});
}
function hideSheet(){const sh=$('sheet');sh.classList.remove('show');document.body.classList.remove('sheet-open')}
function startQuiz(){const p=pool();for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}QP=p.slice(0,LESSON);qi=0;qs={r:0,n:0,xp:0}}

// ---- list
let LIM=150;
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const [a,b]=$('range').value.split('-').map(Number);
  const rows=(q?DATA:DATA.slice(a,b)).filter(d=>!q||d.en.toLowerCase().includes(q)||d.jp.includes(q));
  $('listbox').innerHTML=rows.length?rows.slice(0,LIM).map(d=>`<div class="item"><span class="n">${d.id}</span><div class="t"><span class="e">${esc(d.en)}</span><span class="j">${esc(d.jp)}</span>${d.fix?`<span class="f">修正前 ${esc(d.fix)}</span>`:''}</div><button data-id="${d.id}" title="覚えた／未習得を切り替え">${chip(d)}</button></div>`).join('')+(rows.length>LIM?`<div class="more"><button class="btn blue" id="more">さらに表示（残り${rows.length-LIM}件）</button></div>`:''):'<div class="empty" style="border:0">見つかりませんでした。</div>';
  $('listbox').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id;if(S.known[id])delete S.known[id];else S.known[id]=1;save();header();b.innerHTML=chip(DATA[id-1])});
  const m=$('more'); if(m) m.onclick=()=>{LIM+=300;renderList()};
}

function setTab(t){
  tab=t; hideSheet();
  for(const x of ['card','quiz','list']){$('t-'+x).setAttribute('aria-selected',x===t);$('v-'+x).hidden=x!==t}
  savePrefs(); refresh(false);
}
function savePrefs(){try{localStorage.setItem(KEY+'-p',JSON.stringify({range:$('range').value,filter:$('filter').value,dir:$('dir').value,order:$('order').value,sound:$('sound').value,vib:$('vib').value,tab}))}catch(e){}}
function refresh(reset=true){
  if(reset||!P.length){P=pool();ci=0}
  if(tab==='card')buildCard();
  if(tab==='quiz'){if(reset||!QP.length)startQuiz();renderQuiz()}
  if(tab==='list'){LIM=150;renderList()}
}
$('vib').onchange=()=>{savePrefs();if($('vib').value==='on')buzz(true)};
$('sound').onchange=()=>{savePrefs();if($('sound').value==='on')sfx(true)};
for(const k of ['range','filter','dir','order']) $(k).onchange=()=>{hideSheet();savePrefs();QP=[];refresh(true)};
for(const x of ['card','quiz','list']) $('t-'+x).onclick=()=>setTab(x);
$('ptsBtn').onclick=openBadges; $('bvClose').onclick=closeBadges;
$('goal').value=String(S.goal);
$('goal').onchange=()=>{S.goal=+$('goal').value;if(checkGoal())celebrateGoal();save();header()};
$('fireBtn').onclick=openStreak; $('svClose').onclick=closeStreak;
$('svPrev').onclick=()=>{if(--svM<0){svM=11;svY--}renderStreak()};
$('svNext').onclick=()=>{if(++svM>11){svM=0;svY++}renderStreak()};
$('q').oninput=()=>{LIM=150;renderList()};
document.addEventListener('keydown',e=>{
  if($('sv').classList.contains('open')){if(e.key==='Escape')closeStreak();return}
  if($('bv').classList.contains('open')){if(e.key==='Escape')closeBadges();return}
  if(/INPUT|SELECT/.test(e.target.tagName))return;
  if(tab==='quiz'){
    if(!answered&&/^[1-4]$/.test(e.key)){const b=$('v-quiz').querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
    else if(answered&&e.key==='Enter'&&e.target.id!=='qnext'){const n=$('qnext');if(n)n.click()}
    return;
  }
  if(tab!=='card'||!P.length||e.target.tagName==='BUTTON')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()} else if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
header(); setTab(tab); initSync();

(function(){const s=document.getElementById('splash');if(!s)return;
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{s.classList.add('hide');setTimeout(()=>s.remove(),500)},rm?500:1500);
})();
</script>
