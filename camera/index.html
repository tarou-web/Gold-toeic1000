<style>
  :root { --yellow:#ffd60a; --glass:rgba(40,40,42,.82); --glass2:rgba(28,28,30,.9); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  button { color:inherit; font:inherit; cursor:pointer; border:none; background:none; padding:0; }
  svg { display:block; }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---- top ---- */
  #top { flex:none; height:calc(env(safe-area-inset-top) + 92px); position:relative; }
  #tools { position:absolute; right:16px; bottom:14px; height:46px; padding:0 8px; border-radius:23px;
    background:var(--glass); display:flex; align-items:center; gap:4px;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); }
  #tools button { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; position:relative; }
  #tools button.on { color:var(--yellow); }
  #tools .lbl { position:absolute; right:3px; bottom:5px; font-size:10px; font-weight:700; }
  #rec { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); background:#ff3b30;
    padding:4px 10px; border-radius:7px; font-size:17px; font-variant-numeric:tabular-nums; display:none; }
  #rec.on { display:block; }
  body.recording #tools { display:none; }

  /* ---- preview ---- */
  #stage { flex:none; position:relative; width:100%; aspect-ratio:3/4; overflow:hidden; background:#111; }
  video#video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  #grid { position:absolute; inset:0; pointer-events:none; display:none;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  #grid.on { display:block; }
  #blink { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .18s; }
  #blink.on { opacity:1; transition:none; }
  #countdown { position:absolute; inset:0; display:grid; place-items:center; font-size:120px; font-weight:200;
    pointer-events:none; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #zooms { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:6px; align-items:center; }
  #zooms button { width:40px; height:40px; border-radius:50%; font-size:15px; font-weight:600;
    display:grid; place-items:center; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #zooms button.on { width:52px; height:52px; background:rgba(30,30,32,.62); color:var(--yellow); font-size:17px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-shadow:none; }

  /* ---- bottom ---- */
  #bottom { flex:1; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center;
    padding-bottom:env(safe-area-inset-bottom); min-height:200px; }
  #shutter { width:84px; height:84px; border-radius:50%; border:4px solid rgba(255,255,255,.35);
    display:grid; place-items:center; }
  #shutter i { display:block; width:68px; height:68px; border-radius:50%; background:#fff;
    transition:transform .1s, width .2s, height .2s, border-radius .2s, background .2s; }
  #shutter:active i { transform:scale(.9); }
  body.video #shutter i { background:#ff3b30; }
  body.recording #shutter i { width:32px; height:32px; border-radius:7px; }
  #row { width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 22px; }
  #thumb { width:58px; height:58px; border-radius:50%; overflow:hidden; background:#1c1c1e center/cover no-repeat;
    box-shadow:0 0 0 1px rgba(255,255,255,.15); }
  #modes { height:56px; padding:4px; border-radius:28px; background:var(--glass2); display:flex; position:relative;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1); }
  #modes button { width:100px; height:48px; border-radius:24px; font-size:19px; font-weight:500; position:relative; z-index:1;
    transition:color .2s; }
  #modes button.on { color:var(--yellow); }
  #pillbg { position:absolute; top:4px; width:100px; height:48px; border-radius:24px; background:#000;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); transition:left .25s cubic-bezier(.3,.7,.3,1); left:104px; }
  body.video #pillbg { left:4px; }
  #flip { width:58px; height:58px; border-radius:50%; background:var(--glass2); display:grid; place-items:center;
    transition:transform .4s; }

  /* ---- library ---- */
  .sheet { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:10; }
  .sheet.open { display:flex; }
  .head { display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 8px; }
  .head h2 { margin:0; font-size:17px; font-weight:600; }
  .glassbtn { height:40px; padding:0 16px; border-radius:20px; background:var(--glass); font-size:16px; font-weight:500; }
  .glassbtn.round { width:40px; padding:0; display:grid; place-items:center; }
  #lib { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; align-content:start; }
  #lib .cell { position:relative; aspect-ratio:1; overflow:hidden; background:#111; }
  #lib img, #lib video { width:100%; height:100%; object-fit:cover; display:block; }
  #lib .dur { position:absolute; right:6px; bottom:4px; font-size:12px; font-weight:600; text-shadow:0 1px 2px #000; }
  .note { font-size:12px; color:#8e8e93; text-align:center; padding:10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  #viewer .media { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #viewer img, #viewer video { max-width:100%; max-height:100%; -webkit-touch-callout:default; }
  #vbar { display:flex; justify-content:space-between; align-items:center; padding:10px 16px calc(env(safe-area-inset-bottom) + 12px); }

  /* ---- messages ---- */
  #msg { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px; gap:16px; background:#000; z-index:30; }
  #msg.open { display:flex; }
  #msg h1 { margin:0; font-size:21px; }
  #msg p { margin:0; line-height:1.7; color:#c7c7cc; font-size:15px; max-width:340px; }
  #msgBtn { background:var(--yellow); color:#000; font-weight:600; padding:12px 22px; border-radius:24px; font-size:16px; }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 100px); transform:translateX(-50%);
    background:rgba(30,30,32,.9); padding:9px 15px; border-radius:12px; font-size:14px; opacity:0;
    transition:opacity .2s; pointer-events:none; z-index:40; white-space:nowrap; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="rec">00:00</div>
    <div id="tools">
      <button id="bFlash" aria-label="ライト">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 5 13.2h5.6L9.4 22 18 10.6h-5.6z"/><path id="flashSlash" d="M4 3.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="bTimer" aria-label="タイマー">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
        <span class="lbl" id="timerLbl"></span>
      </button>
      <button id="bGrid" aria-label="グリッド">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
      </button>
    </div>
  </div>

  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="grid"></div>
    <div id="blink"></div>
    <div id="countdown"></div>
    <div id="zooms"></div>
  </div>

  <div id="bottom">
    <button id="shutter" aria-label="シャッター"><i></i></button>
    <div id="row">
      <button id="thumb" aria-label="撮った写真"></button>
      <div id="modes">
        <div id="pillbg"></div>
        <button id="mVideo">ビデオ</button>
        <button id="mPhoto" class="on">写真</button>
      </div>
      <button id="flip" aria-label="カメラ切り替え">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10A7.5 7.5 0 0 0 5.6 7.8"/><path d="M5 4v4h4"/><path d="M4.5 14a7.5 7.5 0 0 0 13.9 2.2"/><path d="M19 20v-4h-4"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="sheet" id="library">
  <div class="head">
    <button class="glassbtn" id="libClose">カメラ</button>
    <h2 id="libTitle">撮影した項目</h2>
    <button class="glassbtn" id="saveAll">すべて保存</button>
  </div>
  <div id="lib"></div>
  <div class="note">このアプリを閉じると消えます。残したいものは「保存」で写真アプリへ。</div>
</div>

<div class="sheet" id="viewer">
  <div class="head">
    <button class="glassbtn round" id="vClose" aria-label="戻る">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="vTitle"></h2>
    <button class="glassbtn round" id="vDel" aria-label="削除">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>
    </button>
  </div>
  <div class="media" id="vMedia"></div>
  <div id="vbar">
    <span class="note" style="padding:0;text-align:left">保存できないときは写真を長押し</span>
    <button class="glassbtn" id="vSave" style="background:var(--yellow);color:#000;font-weight:600">保存</button>
  </div>
</div>

<div id="msg">
  <h1 id="msgTitle"></h1>
  <p id="msgText"></p>
  <button id="msgBtn"></button>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), body = document.body;
  let stream = null, audioStream = null, facing = 'environment', mode = 'photo';
  let torch = false, timer = 0, zoom = 1, hwZoom = null; // hwZoom: {min,max} if supported
  let recorder = null, chunks = [], recStart = 0, recTick = null;
  const items = []; // {blob,url,kind:'photo'|'video',dur}
  let current = -1;

  function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1700); }
  function showMsg(title,text,btn,fn){ $('msgTitle').textContent=title; $('msgText').textContent=text;
    const b=$('msgBtn'); b.style.display=btn?'':'none'; b.textContent=btn||''; b.onclick=fn; $('msg').classList.add('open'); }
  const hideMsg = () => $('msg').classList.remove('open');
  const track = () => stream && stream.getVideoTracks()[0];

  // ---------- camera ----------
  async function start(){
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      showMsg('カメラが使えません','https のアドレスを Safari で開いてください。'); return;
    }
    if (stream) stream.getTracks().forEach(t=>t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:false,
        video:{ facingMode:{ideal:facing}, width:{ideal:3840}, height:{ideal:2160} } });
    } catch(e){
      const denied = e && (e.name==='NotAllowedError'||e.name==='SecurityError');
      showMsg('カメラを使えませんでした',
        denied ? 'カメラへのアクセスが許可されていません。ボタンを押して「許可」を選んでください。'
               : 'カメラを起動できませんでした（'+(e?.name||'エラー')+'）。',
        'もう一度試す', start);
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch(_){}
    hideMsg();
    torch = false; updateFlash();
    setupZoom();
  }

  function setupZoom(){
    hwZoom = null;
    const t = track(), caps = t?.getCapabilities ? t.getCapabilities() : {};
    if (caps.zoom && caps.zoom.max > caps.zoom.min) hwZoom = { min:caps.zoom.min, max:caps.zoom.max };
    let levels;
    if (facing==='user') levels = [];
    else if (hwZoom) levels = [0.5,1,2,5].filter(z => z>=hwZoom.min-0.01 && z<=hwZoom.max+0.01);
    else levels = [1,2,5]; // digital
    if (levels.length < 2) levels = facing==='user' ? [] : levels;
    const base = hwZoom ? Math.max(1, hwZoom.min) : 1;
    zoom = levels.includes(1) ? 1 : base;
    const z = $('zooms'); z.innerHTML='';
    levels.forEach(l=>{
      const b=document.createElement('button'); b.dataset.z=l;
      b.onclick=()=>setZoom(l); z.appendChild(b);
    });
    setZoom(zoom);
  }
  function fmtZ(l, on){ const s = l<1 ? '.'+String(l).split('.')[1] : String(l); return on ? s+'×' : s; }
  async function setZoom(l){
    zoom = l;
    if (hwZoom){
      try { await track().applyConstraints({advanced:[{zoom:l}]}); } catch(_){}
      video.style.transform = facing==='user' ? 'scaleX(-1)' : '';
    } else {
      video.style.transform = (facing==='user' ? 'scaleX(-1) ' : '') + 'scale('+l+')';
    }
    [...$('zooms').children].forEach(b=>{ const on = +b.dataset.z===l; b.classList.toggle('on',on); b.textContent=fmtZ(+b.dataset.z,on); });
  }

  // ---------- photo ----------
  function capturePhoto(){
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh){ toast('カメラの準備中です'); return; }
    // 画面と同じ 3:4 で切り出し（デジタルズーム込み）
    let cw=vw, ch=vw*4/3; if(ch>vh){ ch=vh; cw=vh*3/4; }
    const dz = hwZoom ? 1 : zoom; cw/=dz; ch/=dz;
    const sx=(vw-cw)/2, sy=(vh-ch)/2;
    const outW=Math.round(hwZoom||zoom===1?cw:cw*Math.min(zoom,2)), outH=Math.round(outW*4/3);
    const c=document.createElement('canvas'); c.width=outW; c.height=outH;
    const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high';
    if(facing==='user'){ ctx.translate(outW,0); ctx.scale(-1,1); }
    ctx.drawImage(video,sx,sy,cw,ch,0,0,outW,outH);
    $('blink').classList.add('on'); setTimeout(()=>$('blink').classList.remove('on'),60);
    c.toBlob(blob=>{ if(blob){ items.push({blob,url:URL.createObjectURL(blob),kind:'photo'}); updateThumb(); } },'image/jpeg',0.92);
  }

  // ---------- video ----------
  async function startRec(){
    if(!window.MediaRecorder){ toast('この端末ではビデオ撮影できません'); return; }
    if(!audioStream || audioStream.getAudioTracks().every(t=>t.readyState==='ended')){
      try { audioStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(_){ audioStream = null; toast('マイクなしで録画します'); }
    }
    const tracks=[...stream.getVideoTracks(), ...(audioStream?audioStream.getAudioTracks():[])];
    const ms=new MediaStream(tracks);
    const type=['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported?.(t))||'';
    try { recorder = new MediaRecorder(ms, type?{mimeType:type}:undefined); }
    catch(_){ toast('録画を開始できませんでした'); return; }
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||type||'video/mp4'});
      const dur=Math.round((Date.now()-recStart)/1000);
      items.push({blob,url:URL.createObjectURL(blob),kind:'video',dur}); updateThumb();
    };
    recorder.start(1000); recStart=Date.now();
    body.classList.add('recording'); $('rec').classList.add('on'); $('rec').textContent='00:00';
    recTick=setInterval(()=>{ $('rec').textContent=fmtDur(Math.floor((Date.now()-recStart)/1000)); },250);
    $('modes').style.visibility='hidden'; $('thumb').style.visibility='hidden'; $('flip').style.visibility='hidden';
  }
  function stopRec(){
    if(recorder && recorder.state!=='inactive') recorder.stop();
    clearInterval(recTick); body.classList.remove('recording'); $('rec').classList.remove('on');
    $('modes').style.visibility=''; $('thumb').style.visibility=''; $('flip').style.visibility='';
  }
  const fmtDur = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

  // ---------- shutter / timer ----------
  let counting=false;
  async function onShutter(){
    if(body.classList.contains('recording')){ stopRec(); return; }
    if(counting) return;
    if(timer){
      counting=true; const cd=$('countdown');
      for(let n=timer;n>0;n--){ cd.textContent=n; await new Promise(r=>setTimeout(r,1000)); }
      cd.textContent=''; counting=false;
    }
    if(mode==='photo') capturePhoto(); else startRec();
  }

  // ---------- tools ----------
  function updateFlash(){ $('bFlash').classList.toggle('on',torch); $('flashSlash').style.display=torch?'none':''; }
  $('bFlash').onclick = async ()=>{
    const t=track(), caps=t?.getCapabilities?t.getCapabilities():{};
    if(!caps.torch){ toast('このカメラではライトを使えません'); return; }
    torch=!torch;
    try{ await t.applyConstraints({advanced:[{torch}]}); }catch(_){ torch=false; toast('ライトを点けられませんでした'); }
    updateFlash();
  };
  $('bTimer').onclick = ()=>{
    timer = timer===0?3:timer===3?10:0;
    $('bTimer').classList.toggle('on',!!timer); $('timerLbl').textContent=timer||'';
    toast(timer?'タイマー '+timer+'秒':'タイマー オフ');
  };
  $('bGrid').onclick = ()=>{ const on=$('grid').classList.toggle('on'); $('bGrid').classList.toggle('on',on); };

  // ---------- modes ----------
  function setMode(m){
    if(body.classList.contains('recording')) return;
    mode=m; body.classList.toggle('video',m==='video');
    $('mVideo').classList.toggle('on',m==='video'); $('mPhoto').classList.toggle('on',m==='photo');
  }
  $('mVideo').onclick=()=>setMode('video'); $('mPhoto').onclick=()=>setMode('photo');
  // 左右スワイプでも切り替え
  let sx0=null;
  $('stage').addEventListener('touchstart',e=>{ sx0=e.touches[0].clientX; },{passive:true});
  $('stage').addEventListener('touchend',e=>{ if(sx0==null) return; const dx=e.changedTouches[0].clientX-sx0; sx0=null;
    if(Math.abs(dx)>60) setMode(dx>0?'video':'photo'); },{passive:true});

  let flipDeg=0;
  $('flip').onclick=()=>{ facing=facing==='environment'?'user':'environment'; flipDeg+=180; $('flip').style.transform='rotate('+flipDeg+'deg)'; start(); };
  $('shutter').onclick=onShutter;

  // ---------- library ----------
  function updateThumb(){
    const last=items[items.length-1], th=$('thumb');
    th.innerHTML=''; th.style.backgroundImage='';
    if(!last) return;
    if(last.kind==='photo') th.style.backgroundImage='url('+last.url+')';
    else { const v=document.createElement('video'); v.src=last.url+'#t=0.1'; v.muted=true; v.playsInline=true; v.preload='metadata';
      v.style.cssText='width:100%;height:100%;object-fit:cover'; th.appendChild(v); }
  }
  function renderLib(){
    const g=$('lib'); g.innerHTML='';
    $('libTitle').textContent=items.length+'項目';
    items.slice().reverse().forEach((it,ri)=>{
      const i=items.length-1-ri, cell=document.createElement('div'); cell.className='cell'; cell.onclick=()=>openViewer(i);
      if(it.kind==='photo'){ const im=document.createElement('img'); im.src=it.url; cell.appendChild(im); }
      else { const v=document.createElement('video'); v.src=it.url+'#t=0.1'; v.muted=true; v.playsInline=true; v.preload='metadata'; cell.appendChild(v);
        const d=document.createElement('span'); d.className='dur'; d.textContent=fmtDur(it.dur||0); cell.appendChild(d); }
      g.appendChild(cell);
    });
  }
  $('thumb').onclick=()=>{ if(!items.length){ toast('まだ撮影していません'); return; } openViewer(items.length-1); };
  function openViewer(i){
    current=i; const it=items[i], m=$('vMedia'); m.innerHTML='';
    if(it.kind==='photo'){ const im=document.createElement('img'); im.src=it.url; m.appendChild(im); }
    else { const v=document.createElement('video'); v.src=it.url; v.controls=true; v.playsInline=true; m.appendChild(v); }
    $('vTitle').textContent=(i+1)+' / '+items.length;
    $('viewer').classList.add('open');
  }
  $('vTitle').onclick=()=>{ renderLib(); $('library').classList.add('open'); $('viewer').classList.remove('open'); };
  $('vClose').onclick=()=>$('viewer').classList.remove('open');
  $('libClose').onclick=()=>$('library').classList.remove('open');
  // ビューア内で左右スワイプで前後へ
  let vx0=null;
  $('vMedia').addEventListener('touchstart',e=>{ vx0=e.touches[0].clientX; },{passive:true});
  $('vMedia').addEventListener('touchend',e=>{ if(vx0==null) return; const dx=e.changedTouches[0].clientX-vx0; vx0=null;
    if(dx<-60 && current<items.length-1) openViewer(current+1);
    else if(dx>60 && current>0) openViewer(current-1); },{passive:true});
  $('vDel').onclick=()=>{
    URL.revokeObjectURL(items[current].url); items.splice(current,1); updateThumb();
    if(!items.length){ $('viewer').classList.remove('open'); return; }
    openViewer(Math.min(current,items.length-1));
  };

  function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
  async function share(list){
    const files=list.map((it,i)=>{ const ext=it.kind==='photo'?'jpg':(it.blob.type.includes('webm')?'webm':'mp4');
      return new File([it.blob],(it.kind==='photo'?'IMG_':'MOV_')+stamp()+'_'+(i+1)+'.'+ext,{type:it.blob.type||'application/octet-stream'}); });
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files}); return true; }catch(e){ if(e?.name==='AbortError') return true; }
    }
    return false;
  }
  $('vSave').onclick=async()=>{ if(!(await share([items[current]]))) toast('写真を長押しして保存してください'); };
  $('saveAll').onclick=async()=>{ if(!(await share(items))) toast('1つずつ開いて保存してください'); };

  // ---------- lifecycle ----------
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden' && body.classList.contains('recording')) stopRec();
    if(document.visibilityState==='visible' && (!stream || stream.getVideoTracks().every(t=>t.readyState==='ended'))) start();
  });
  window.addEventListener('beforeunload',e=>{ if(items.length){ e.preventDefault(); e.returnValue=''; } });

  start();
})();
</script>
</body>
</html>
