<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>大学カメラ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大学カメラ">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=14">
<link rel="icon" href="apple-touch-icon.png">
<style>
  :root { --appH:100svh; --stageH:min(133.333vw, calc(var(--appH) - var(--st) - var(--sb) - 227px)); --belowTop:calc(var(--st) + 58px + var(--stageH)); --st:clamp(0px, env(safe-area-inset-top), 62px); --sb:clamp(12px, env(safe-area-inset-bottom), 34px); --yellow:#ffd60a; --glass:rgba(40,40,42,.82); --glass2:rgba(28,28,30,.9); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:var(--appH); position:relative; background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans",sans-serif;
    overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  button { color:inherit; font:inherit; cursor:pointer; border:none; background:none; padding:0; }
  svg { display:block; }

  #bgv { position:absolute; left:-40px; top:-40px; width:calc(100% + 80px); height:calc(var(--appH) + 80px); object-fit:cover;
    filter:blur(30px) brightness(.55) saturate(1.2); -webkit-filter:blur(30px) brightness(.55) saturate(1.2); pointer-events:none; }
  #bgv.mirror { transform:scaleX(-1); }
  #app { position:absolute; left:0; top:0; width:100%; height:var(--appH); }

  /* ---- top ---- */
  #top { position:absolute; left:0; top:0; width:100%; height:calc(var(--st) + 58px); }
  #tools { position:absolute; right:16px; top:calc(var(--st) + 8px); height:32px; padding:0 3px; border-radius:16px;
    background:var(--glass); display:flex; align-items:center; gap:0;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); }
  #tools button { width:32px; height:32px; display:grid; place-items:center; position:relative; }
  #tools button.on { color:var(--yellow); }
  #tools .lbl { position:absolute; right:0; bottom:3px; font-size:9px; font-weight:700; }
  #rec { position:absolute; left:50%; top:calc(var(--st) + 20px); transform:translateX(-50%); background:#ff3b30;
    padding:3px 8px; border-radius:6px; font-size:15px; font-variant-numeric:tabular-nums; display:none; }
  #rec.on { display:block; }
  body.recording #tools { display:none; }

  /* ---- preview ---- */
  #stage { position:absolute; left:0; top:calc(var(--st) + 58px); width:100%;
    height:var(--stageH); overflow:hidden; background:#111; }
  video#video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center; }
  #grid { position:absolute; inset:0; pointer-events:none; display:none;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  #grid.on { display:block; }
  #blink { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .18s; }
  #blink.on { opacity:1; transition:none; }
  #countdown { position:absolute; inset:0; display:grid; place-items:center; font-size:120px; font-weight:200;
    pointer-events:none; text-shadow:0 2px 12px rgba(0,0,0,.5); }
  #zooms { position:absolute; left:50%; bottom:5px; padding:12px 30px; margin-left:-30px; display:flex; gap:2px; align-items:center; }
  #zooms button { width:33px; height:33px; border-radius:50%; font-size:12px; font-weight:600;
    display:grid; place-items:center; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #zooms button.on { background:rgba(30,30,32,.55); color:var(--yellow);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); text-shadow:none; }

  /* ---- bottom ---- */
  #bottom { position:absolute; left:0; top:0; width:100%; height:0; }
  #shutter { position:absolute; left:50%; top:calc(var(--belowTop) + 16px); transform:translateX(-50%);
    width:71px; height:71px; border-radius:50%; border:3px solid rgba(255,255,255,.3); display:grid; place-items:center; }
  #shutter i { display:block; width:61px; height:61px; border-radius:50%; background:#fff;
    transition:transform .1s, width .2s, height .2s, border-radius .2s, background .2s; }
  #shutter:active i { transform:scale(.9); }
  body.video #shutter i { background:#ff3b30; }
  body.recording #shutter i { width:27px; height:27px; border-radius:7px; }
  #row { position:absolute; left:0; top:calc(var(--belowTop) + 108px); width:100%; height:43px; display:flex; align-items:center;
    justify-content:space-between; padding:0 36px; }
  #thumb { width:43px; height:43px; border-radius:50%; overflow:hidden; background:#1c1c1e center/cover no-repeat;
    box-shadow:0 0 0 .5px rgba(255,255,255,.15); }
  #modes { height:42px; padding:3px; border-radius:21px; background:var(--glass2); display:flex; position:relative;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1); }
  #modes button { width:72px; height:36px; border-radius:18px; font-size:13px; font-weight:500; position:relative; z-index:1;
    transition:color .2s; }
  #modes button.on { color:var(--yellow); }
  #pillbg { position:absolute; top:3px; width:72px; height:36px; border-radius:18px; background:#000;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); transition:left .25s cubic-bezier(.3,.7,.3,1); left:75px; }
  body.video #pillbg { left:3px; }
  #flip { width:43px; height:43px; border-radius:50%; background:var(--glass2); display:grid; place-items:center;
    transition:transform .4s; }

  /* ---- library ---- */
  .sheet { position:absolute; left:0; top:0; width:100%; height:var(--appH); background:#000; display:none; flex-direction:column; z-index:10; }
  .sheet.open { display:flex; }
  .head { display:flex; justify-content:space-between; align-items:center;
    padding:calc(var(--st) + 8px) 16px 8px; }
  .head h2 { margin:0; font-size:17px; font-weight:600; }
  .glassbtn { height:40px; padding:0 16px; border-radius:20px; background:var(--glass); font-size:16px; font-weight:500; }
  .glassbtn.round { width:40px; padding:0; display:grid; place-items:center; }
  #lib { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; align-content:start; }
  #lib .cell { position:relative; aspect-ratio:1; overflow:hidden; background:#111; }
  #lib img, #lib video { width:100%; height:100%; object-fit:cover; display:block; }
  #lib .dur { position:absolute; right:6px; bottom:4px; font-size:12px; font-weight:600; text-shadow:0 1px 2px #000; }
  .note { font-size:12px; color:#8e8e93; text-align:center; padding:10px 16px calc(env(safe-area-inset-bottom) + 10px); }
  #viewer { background:#000; }
  #vtop { position:absolute; left:0; right:0; top:calc(var(--st) + 0px); height:38px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; z-index:2; }
  .pcircle { width:38px; height:38px; border-radius:50%; background:#1c1c1e; display:grid; place-items:center;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); }
  .pcircle.big { width:42px; height:42px; }
  .ppill { height:38px; border-radius:19px; background:#1c1c1e; box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12); display:flex; align-items:center; }
  .ppill.big { height:42px; border-radius:21px; }
  #vWhen { width:140px; flex-direction:column; justify-content:center; line-height:1.15; }
  #vWhen b { font-size:12.5px; font-weight:600; }
  #vWhen span { font-size:10.5px; font-variant-numeric:tabular-nums; }
  #vRight { width:95px; justify-content:space-around; padding:0 6px; }
  #vRight button, #vMid button { height:100%; display:grid; place-items:center; padding:0 8px; }
  #vMid { width:144px; justify-content:space-around; padding:0 10px; }
  #vtop svg, #vbottom svg { transform:scale(.86); }
  #vFav.on { color:#ff375f; }
  #vFav.on path { fill:#ff375f; }
  #vMenu { position:absolute; right:16px; top:calc(var(--st) + 45px); z-index:3; background:rgba(44,44,46,.97); border-radius:14px;
    display:none; flex-direction:column; min-width:230px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #vMenu.open { display:flex; }
  #vMenu button { text-align:left; padding:13px 16px; font-size:16px; border-bottom:.5px solid rgba(255,255,255,.12); }
  #vMenu button:last-child { border-bottom:none; }
  #viewer .media { position:absolute; left:0; right:0; top:calc(var(--st) + 50px); bottom:calc(var(--sb) + 125px);
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #vStrip { position:absolute; left:0; right:0; bottom:calc(var(--sb) + 70px); height:30px; display:flex; align-items:center;
    gap:2px; overflow-x:auto; padding:0 50%; scrollbar-width:none; }
  #vStrip::-webkit-scrollbar { display:none; }
  #vStrip .t { flex:none; width:20px; height:30px; border-radius:3px; overflow:hidden; background:#222; position:relative; transition:width .2s; }
  #vStrip .t.cur { width:30px; margin:0 6px; }
  #vStrip img, #vStrip video { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  #vbottom { position:absolute; left:0; right:0; bottom:calc(var(--sb) + 8px); height:42px; padding:0 30px;
    display:flex; align-items:center; justify-content:space-between; }
  #viewer img, #viewer video { max-width:100%; max-height:100%; -webkit-touch-callout:default; }

  /* ---- messages ---- */
  #msg { position:absolute; left:0; top:0; width:100%; height:var(--appH); display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px; gap:16px; background:#000; z-index:30; }
  #msg.open { display:flex; }
  #msg h1 { margin:0; font-size:21px; }
  #msg p { margin:0; line-height:1.7; color:#c7c7cc; font-size:15px; max-width:340px; }
  #msgBtn { background:var(--yellow); color:#000; font-weight:600; padding:12px 22px; border-radius:24px; font-size:16px; }
  .rotg { transition:transform .3s ease; }
  #lsnote { position:absolute; inset:0; z-index:50; background:#000; display:none; align-items:center; justify-content:center;
    text-align:center; padding:40px; font-size:15px; line-height:1.7; color:#c7c7cc; }
  @media (orientation:landscape) and (max-height:500px) { #lsnote { display:flex; } }
  #toast { position:absolute; left:50%; top:calc(var(--st) + 100px); transform:translateX(-50%);
    background:rgba(30,30,32,.9); padding:9px 15px; border-radius:12px; font-size:14px; opacity:0;
    transition:opacity .2s; pointer-events:none; z-index:40; white-space:nowrap; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<video id="bgv" playsinline muted autoplay aria-hidden="true"></video>
<div id="app">
  <div id="top">
    <div id="rec">00:00</div>
    <div id="tools">
      <button id="bFlash" aria-label="ライト">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 5 13.2h5.6L9.4 22 18 10.6h-5.6z"/><path id="flashSlash" d="M4 3.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="bTimer" aria-label="タイマー">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
        <span class="lbl" id="timerLbl"></span>
      </button>
      <button id="bGrid" aria-label="グリッド">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
      </button>
    </div>
  </div>

  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="grid"></div>
    <div id="blink"></div>
    <div id="countdown"></div>
    <div id="zooms"></div>
  </div>

  <div id="bottom">
    <button id="shutter" aria-label="シャッター"><i></i></button>
    <div id="row">
      <button id="thumb" aria-label="撮った写真"></button>
      <div id="modes">
        <div id="pillbg"></div>
        <button id="mVideo">ビデオ</button>
        <button id="mPhoto" class="on">写真</button>
      </div>
      <button id="flip" aria-label="カメラ切り替え">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10A7.5 7.5 0 0 0 5.6 7.8"/><path d="M5 4v4h4"/><path d="M4.5 14a7.5 7.5 0 0 0 13.9 2.2"/><path d="M19 20v-4h-4"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="sheet" id="library">
  <div class="head">
    <button class="glassbtn" id="libClose">カメラ</button>
    <h2 id="libTitle">撮影した項目</h2>
    <button class="glassbtn" id="saveAll">すべて保存</button>
  </div>
  <div id="lib"></div>
  <div class="note">このアプリを閉じると消えます。残したいものは「保存」で写真アプリへ。<br>大学カメラ ver.21</div>
</div>

<div class="sheet" id="viewer">
  <div id="vtop">
    <button class="pcircle" id="vClose" aria-label="戻る">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
    </button>
    <div class="ppill" id="vWhen"><b id="vDay">今日</b><span id="vTime"></span></div>
    <div class="ppill" id="vRight">
      <button id="vLib" aria-label="一覧">
        <svg width="28" height="24" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="6" width="19" height="15" rx="3"/><path d="M3 16V6a3 3 0 0 1 3-3h14"/><path d="m8 19 6-6 4 4 3-3 5 5" stroke-linejoin="round"/><circle cx="20" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="vMore" aria-label="その他">
        <svg width="26" height="8" viewBox="0 0 26 8" fill="currentColor"><circle cx="4" cy="4" r="2.7"/><circle cx="13" cy="4" r="2.7"/><circle cx="22" cy="4" r="2.7"/></svg>
      </button>
    </div>
  </div>
  <div id="vMenu">
    <button id="mSaveAll">すべて写真アプリに保存</button>
    <button id="mHelp">保存できないときは…</button>
  </div>
  <div class="media" id="vMedia"></div>
  <div id="vStrip"></div>
  <div id="vbottom">
    <button class="pcircle big" id="vSave" aria-label="保存">
      <svg width="24" height="28" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v15M6.5 7.5 12 2l5.5 5.5"/><path d="M8 11.5H5.5A2.5 2.5 0 0 0 3 14v9a2.5 2.5 0 0 0 2.5 2.5h13A2.5 2.5 0 0 0 21 23v-9a2.5 2.5 0 0 0-2.5-2.5H16"/></svg>
    </button>
    <div class="ppill big" id="vMid">
      <button id="vFav" aria-label="お気に入り">
        <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M13 22S2 15.5 2 8.2A5.6 5.6 0 0 1 13 5.6 5.6 5.6 0 0 1 24 8.2C24 15.5 13 22 13 22z"/></svg>
      </button>
      <button id="vInfo" aria-label="情報">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="13" cy="13" r="11"/><path d="M13 11.5v7M10.5 18.5h5M10.8 11.5H13" stroke-linecap="round"/><circle cx="12.8" cy="7.6" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="vEdit" aria-label="編集">
        <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M2 5h22M2 12h22M2 19h22"/><circle cx="16" cy="5" r="2.6" fill="#1c1c1e"/><circle cx="9" cy="12" r="2.6" fill="#1c1c1e"/><circle cx="17" cy="19" r="2.6" fill="#1c1c1e"/></svg>
      </button>
    </div>
    <button class="pcircle big" id="vDel" aria-label="削除">
      <svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5.5h19M7.5 5.5V3a1.5 1.5 0 0 1 1.5-1.5h4A1.5 1.5 0 0 1 14.5 3v2.5M3.8 5.5l1.2 17A2 2 0 0 0 7 24.5h8a2 2 0 0 0 2-2l1.2-17M8.5 10v10M11 10v10M13.5 10v10"/></svg>
    </button>
  </div>
</div>

<div id="msg">
  <h1 id="msgTitle"></h1>
  <p id="msgText"></p>
  <button id="msgBtn"></button>
</div>
<div id="lsnote">画面が横向きに回転しています。<br>コントロールセンターで「画面縦向きのロック」をオンにすると、<br>純正カメラと同じように横向きで撮影できます。</div>
<div id="toast"></div>

<script>
(() => {
  // 新しい版が公開されていたら自動で読み込み直す（ホーム画面アプリは古い版を長く覚えているため）
  const VERSION = '21';
  try {
    fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'})
      .then(r => r.ok ? r.text() : '')
      .then(t => { const m = t.match(/const VERSION = '(\d+)'/);
        if (m && m[1] !== VERSION) location.replace(location.pathname + '?v=' + m[1]); })
      .catch(()=>{});
  } catch(_){}
  const $ = id => document.getElementById(id);
  const video = $('video'), body = document.body;
  let stream = null, audioStream = null, facing = 'environment', mode = 'photo';
  let torch = false, timer = 0, zoom = 1, hwZoom = null; // hwZoom: {min,max} if supported
  let recorder = null, chunks = [], recStart = 0, recTick = null;
  const items = []; // {blob,url,kind:'photo'|'video',dur}
  let current = -1;

  function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1700); }
  function showMsg(title,text,btn,fn){ $('msgTitle').textContent=title; $('msgText').textContent=text;
    const b=$('msgBtn'); b.style.display=btn?'':'none'; b.textContent=btn||''; b.onclick=fn; $('msg').classList.add('open'); }
  const hideMsg = () => $('msg').classList.remove('open');
  const track = () => stream && stream.getVideoTracks()[0];

  // ---------- camera ----------
  async function start(){
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      showMsg('カメラが使えません','https のアドレスを Safari で開いてください。'); return;
    }
    if (stream) stream.getTracks().forEach(t=>t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:false,
        video:{ facingMode:{ideal:facing}, width:{ideal:3840}, height:{ideal:2160} } });
    } catch(e){
      const denied = e && (e.name==='NotAllowedError'||e.name==='SecurityError');
      showMsg('カメラを使えませんでした',
        denied ? 'カメラへのアクセスが許可されていません。ボタンを押して「許可」を選んでください。'
               : 'カメラを起動できませんでした（'+(e?.name||'エラー')+'）。',
        'もう一度試す', start);
      return;
    }
    video.srcObject = stream;
    try { await video.play(); } catch(_){}
    const bgv=$('bgv'); bgv.srcObject = stream; bgv.classList.toggle('mirror', facing==='user');
    try { await bgv.play(); } catch(_){}
    hideMsg();
    torch = false; updateFlash();
    setupZoom();
  }

  function setupZoom(){
    hwZoom = null;
    const t = track(), caps = t?.getCapabilities ? t.getCapabilities() : {};
    if (caps.zoom && caps.zoom.max > caps.zoom.min) hwZoom = { min:caps.zoom.min, max:caps.zoom.max };
    let levels;
    if (facing==='user') levels = [];
    else if (hwZoom) levels = [0.5,1,2,5].filter(z => z>=hwZoom.min-0.01 && z<=hwZoom.max+0.01);
    else levels = [1,2,5]; // digital
    if (levels.length < 2) levels = facing==='user' ? [] : levels;
    const base = hwZoom ? Math.max(1, hwZoom.min) : 1;
    zoom = levels.includes(1) ? 1 : base;
    const z = $('zooms'); z.innerHTML='';
    levels.forEach(l=>{
      const b=document.createElement('button'); b.dataset.z=l;
      b.onclick=()=>setZoom(l); z.appendChild(b);
    });
    setZoom(zoom);
    centerOne();
  }
  function centerOne(){
    const z=$('zooms'), one=[...z.children].find(b=>+b.dataset.z===1)||z.children[0];
    if(!one){ return; }
    const idx=[...z.children].indexOf(one);
    z.style.transform='translateX('+(-(idx*35+16.5))+'px)';
  }
  function fmtZ(l, on){ const s = l<1 ? '.'+String(l).split('.')[1] : String(l); return on ? s+'×' : s; }
  let zBusy=false, zNext=null;
  async function applyHw(l){
    if (zBusy){ zNext=l; return; }
    zBusy=true;
    try { await track().applyConstraints({advanced:[{zoom:l}]}); } catch(_){}
    zBusy=false;
    if (zNext!=null){ const n=zNext; zNext=null; applyHw(n); }
  }
  function zoomRange(){ return hwZoom ? [hwZoom.min, Math.min(hwZoom.max, 15)] : [1, 5]; }
  function fmtFree(z){ if (z<1) return '.'+Math.round(z*10); const r=Math.round(z*10)/10; return (r%1===0? String(r) : r.toFixed(1)); }
  function setZoom(l){
    const [mn,mx]=zoomRange(); l=Math.min(mx,Math.max(mn,l)); zoom = l;
    if (hwZoom){
      applyHw(l);
      video.style.transform = facing==='user' ? 'scaleX(-1)' : '';
    } else {
      video.style.transform = (facing==='user' ? 'scaleX(-1) ' : '') + 'scale('+l+')';
    }
    // 純正と同じく、今の倍率以下でいちばん近いボタンを光らせ、その中に今の倍率を表示
    const btns=[...$('zooms').children]; let act=null;
    btns.forEach(b=>{ if (+b.dataset.z <= l+0.001) act=b; });
    if (!act) act=btns[0];
    btns.forEach(b=>{ const on=b===act; b.classList.toggle('on',on);
      b.textContent = on ? fmtFree(l)+'×' : fmtZ(+b.dataset.z,false); });
  }

  // ---------- photo ----------
  function capturePhoto(){
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh){ toast('カメラの準備中です'); return; }
    // 画面と同じ 3:4 で切り出し（デジタルズーム込み）
    const st=$('stage'), asp=st.clientWidth/st.clientHeight; // 幅/高さ
    let cw=vw, ch=vw/asp; if(ch>vh){ ch=vh; cw=vh*asp; }
    const dz = hwZoom ? 1 : zoom; cw/=dz; ch/=dz;
    const sx=(vw-cw)/2, sy=(vh-ch)/2;
    const outW=Math.round(hwZoom||zoom===1?cw:cw*Math.min(zoom,2)), outH=Math.round(outW/asp);
    const c=document.createElement('canvas'); c.width=outW; c.height=outH;
    const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high';
    if(facing==='user'){ ctx.translate(outW,0); ctx.scale(-1,1); }
    ctx.drawImage(video,sx,sy,cw,ch,0,0,outW,outH);
    $('blink').classList.add('on'); setTimeout(()=>$('blink').classList.remove('on'),60);
    let out=c;
    if(rot!==0){ // 横向きで撮ったら横向きの写真にする
      out=document.createElement('canvas'); out.width=outH; out.height=outW;
      const o=out.getContext('2d'); o.translate(outH/2,outW/2); o.rotate(-rot*Math.PI/180); o.drawImage(c,-outW/2,-outH/2);
    }
    out.toBlob(blob=>{ if(blob){ items.push({blob,url:URL.createObjectURL(blob),kind:'photo',t:Date.now()}); updateThumb(); } },'image/jpeg',0.92);
  }

  // ---------- video ----------
  async function startRec(){
    if(!window.MediaRecorder){ toast('この端末ではビデオ撮影できません'); return; }
    if(!audioStream || audioStream.getAudioTracks().every(t=>t.readyState==='ended')){
      try { audioStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(_){ audioStream = null; toast('マイクなしで録画します'); }
    }
    const tracks=[...stream.getVideoTracks(), ...(audioStream?audioStream.getAudioTracks():[])];
    const ms=new MediaStream(tracks);
    const type=['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported?.(t))||'';
    try { recorder = new MediaRecorder(ms, type?{mimeType:type}:undefined); }
    catch(_){ toast('録画を開始できませんでした'); return; }
    chunks=[];
    recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:recorder.mimeType||type||'video/mp4'});
      const dur=Math.round((Date.now()-recStart)/1000);
      items.push({blob,url:URL.createObjectURL(blob),kind:'video',dur,t:Date.now()}); updateThumb();
    };
    recorder.start(1000); recStart=Date.now();
    body.classList.add('recording'); $('rec').classList.add('on'); $('rec').textContent='00:00';
    recTick=setInterval(()=>{ $('rec').textContent=fmtDur(Math.floor((Date.now()-recStart)/1000)); },250);
    $('modes').style.visibility='hidden'; $('thumb').style.visibility='hidden'; $('flip').style.visibility='hidden';
  }
  function stopRec(){
    if(recorder && recorder.state!=='inactive') recorder.stop();
    clearInterval(recTick); body.classList.remove('recording'); $('rec').classList.remove('on');
    $('modes').style.visibility=''; $('thumb').style.visibility=''; $('flip').style.visibility='';
  }
  const fmtDur = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

  // ---------- shutter / timer ----------
  let counting=false;
  async function onShutter(){
    if(body.classList.contains('recording')){ stopRec(); return; }
    if(counting) return;
    if(timer){
      counting=true; const cd=$('countdown');
      for(let n=timer;n>0;n--){ cd.textContent=n; await new Promise(r=>setTimeout(r,1000)); }
      cd.textContent=''; counting=false;
    }
    if(mode==='photo') capturePhoto(); else startRec();
  }

  // ---------- tools ----------
  function updateFlash(){ $('bFlash').classList.toggle('on',torch); $('flashSlash').style.display=torch?'none':''; }
  $('bFlash').onclick = async ()=>{
    const t=track(), caps=t?.getCapabilities?t.getCapabilities():{};
    if(!caps.torch){ toast('このカメラではライトを使えません'); return; }
    torch=!torch;
    try{ await t.applyConstraints({advanced:[{torch}]}); }catch(_){ torch=false; toast('ライトを点けられませんでした'); }
    updateFlash();
  };
  $('bTimer').onclick = ()=>{
    timer = timer===0?3:timer===3?10:0;
    $('bTimer').classList.toggle('on',!!timer); $('timerLbl').textContent=timer||'';
    toast(timer?'タイマー '+timer+'秒':'タイマー オフ');
  };
  $('bGrid').onclick = ()=>{ const on=$('grid').classList.toggle('on'); $('bGrid').classList.toggle('on',on); };

  // ---------- modes ----------
  function setMode(m){
    if(body.classList.contains('recording')) return;
    mode=m; body.classList.toggle('video',m==='video');
    $('mVideo').classList.toggle('on',m==='video'); $('mPhoto').classList.toggle('on',m==='photo');
  }
  $('mVideo').onclick=()=>setMode('video'); $('mPhoto').onclick=()=>setMode('photo');
  // 左右スワイプでも切り替え
  // ズーム倍率の数字の上を横にスライドしてズーム（右へで拡大、左へで縮小）
  let zs=null, zDragged=false;
  const zEl=$('zooms');
  zEl.addEventListener('touchstart',e=>{ e.stopPropagation(); if(e.touches.length===1){ zs={x:e.touches[0].clientX, z:zoom}; zDragged=false; } },{passive:true});
  zEl.addEventListener('touchmove',e=>{
    e.stopPropagation(); if(!zs || facing==='user') return;
    const dx=e.touches[0].clientX-zs.x;
    if (Math.abs(dx)>6) zDragged=true;
    if (zDragged){ e.preventDefault(); setZoom(zs.z * Math.pow(2, dx/70)); }
  },{passive:false});
  zEl.addEventListener('touchend',e=>{ e.stopPropagation(); zs=null; },{passive:true});
  // スライドした直後はボタンのタップ扱いにしない
  zEl.addEventListener('click',e=>{ if(zDragged){ e.stopPropagation(); e.preventDefault(); zDragged=false; } },true);

  let sx0=null, pinch=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  $('stage').addEventListener('touchstart',e=>{
    if (e.touches.length===2){ pinch={d:dist(e.touches), z:zoom}; sx0=null; }
    else if (e.touches.length===1 && !pinch) sx0=e.touches[0].clientX;
  },{passive:true});
  $('stage').addEventListener('touchmove',e=>{
    if (pinch && e.touches.length===2 && facing!=='user'){ setZoom(pinch.z * dist(e.touches)/pinch.d); }
  },{passive:true});
  $('stage').addEventListener('touchend',e=>{
    if (pinch){ if (e.touches.length===0) pinch=null; return; }
    if(sx0==null) return; const dx=e.changedTouches[0].clientX-sx0; sx0=null;
    if(Math.abs(dx)>60) setMode(dx>0?'video':'photo'); },{passive:true});

  let flipDeg=0;
  $('flip').onclick=()=>{ facing=facing==='environment'?'user':'environment'; flipDeg+=180; $('flip').style.transform='rotate('+flipDeg+'deg)'; start(); };
  $('shutter').onclick=onShutter;

  // ---------- library ----------
  function updateThumb(){
    const last=items[items.length-1], th=$('thumb');
    th.innerHTML=''; th.style.backgroundImage='';
    if(!last) return;
    if(last.kind==='photo') th.style.backgroundImage='url('+last.url+')';
    else { const v=document.createElement('video'); v.src=last.url+'#t=0.1'; v.muted=true; v.playsInline=true; v.preload='metadata';
      v.style.cssText='width:100%;height:100%;object-fit:cover'; th.appendChild(v); }
  }
  function renderLib(){
    const g=$('lib'); g.innerHTML='';
    $('libTitle').textContent=items.length+'項目';
    items.slice().reverse().forEach((it,ri)=>{
      const i=items.length-1-ri, cell=document.createElement('div'); cell.className='cell'; cell.onclick=()=>openViewer(i);
      if(it.kind==='photo'){ const im=document.createElement('img'); im.src=it.url; cell.appendChild(im); }
      else { const v=document.createElement('video'); v.src=it.url+'#t=0.1'; v.muted=true; v.playsInline=true; v.preload='metadata'; cell.appendChild(v);
        const d=document.createElement('span'); d.className='dur'; d.textContent=fmtDur(it.dur||0); cell.appendChild(d); }
      g.appendChild(cell);
    });
  }
  $('thumb').onclick=()=>{ if(!items.length){ toast('まだ撮影していません'); return; } openViewer(items.length-1); };
  function openViewer(i){
    current=i; const it=items[i], m=$('vMedia'); m.innerHTML='';
    if(it.kind==='photo'){ const im=document.createElement('img'); im.src=it.url; m.appendChild(im); }
    else { const v=document.createElement('video'); v.src=it.url; v.controls=true; v.playsInline=true; m.appendChild(v); }
    const d=new Date(it.t||Date.now()), now=new Date();
    $('vDay').textContent = d.toDateString()===now.toDateString() ? '今日' : (d.getMonth()+1)+'月'+d.getDate()+'日';
    $('vTime').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    $('vFav').classList.toggle('on', !!it.fav);
    $('vMenu').classList.remove('open');
    $('viewer').classList.add('open');
    renderStrip();
  }
  function renderStrip(){
    const st=$('vStrip'); st.innerHTML='';
    items.forEach((it,i)=>{
      const t=document.createElement('div'); t.className='t'+(i===current?' cur':''); t.onclick=()=>openViewer(i);
      if(it.kind==='photo'){ const im=document.createElement('img'); im.src=it.url; t.appendChild(im); }
      else { const v=document.createElement('video'); v.src=it.url+'#t=0.1'; v.muted=true; v.playsInline=true; v.preload='metadata'; t.appendChild(v); }
      st.appendChild(t);
    });
    requestAnimationFrame(()=>{ const cur=st.children[current]; if(cur) st.scrollLeft = cur.offsetLeft + cur.offsetWidth/2 - st.clientWidth/2; });
  }
  $('vLib').onclick=()=>{ renderLib(); $('library').classList.add('open'); $('viewer').classList.remove('open'); };
  $('vMore').onclick=e=>{ e.stopPropagation(); $('vMenu').classList.toggle('open'); };
  $('viewer').addEventListener('click',e=>{ if(!e.target.closest('#vMenu,#vMore')) $('vMenu').classList.remove('open'); });
  $('mSaveAll').onclick=async()=>{ $('vMenu').classList.remove('open'); if(!(await share(items))) toast('1つずつ保存してください'); };
  $('mHelp').onclick=()=>{ $('vMenu').classList.remove('open'); toast('写真を長押しして「写真に保存」'); };
  $('vFav').onclick=()=>{ const it=items[current]; it.fav=!it.fav; $('vFav').classList.toggle('on',it.fav); };
  $('vInfo').onclick=()=>{ const it=items[current], m=$('vMedia').firstChild;
    const size= it.blob.size>=1048576 ? (it.blob.size/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(it.blob.size/1024))+'KB';
    const dim = it.kind==='photo' && m ? m.naturalWidth+'×'+m.naturalHeight : (it.dur!=null? fmtDur(it.dur):'');
    toast((it.kind==='photo'?'写真':'ビデオ')+'  '+dim+'  '+size); };
  $('vEdit').onclick=()=>toast('編集は写真アプリに保存してからできます');
  $('vClose').onclick=()=>$('viewer').classList.remove('open');
  $('libClose').onclick=()=>$('library').classList.remove('open');
  // ビューア内で左右スワイプで前後へ
  let vx0=null;
  $('vMedia').addEventListener('touchstart',e=>{ vx0=e.touches[0].clientX; },{passive:true});
  $('vMedia').addEventListener('touchend',e=>{ if(vx0==null) return; const dx=e.changedTouches[0].clientX-vx0; vx0=null;
    if(dx<-60 && current<items.length-1) openViewer(current+1);
    else if(dx>60 && current>0) openViewer(current-1); },{passive:true});
  $('vDel').onclick=()=>{
    URL.revokeObjectURL(items[current].url); items.splice(current,1); updateThumb();
    if(!items.length){ $('viewer').classList.remove('open'); return; }
    openViewer(Math.min(current,items.length-1));
  };

  function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
  async function share(list){
    const files=list.map((it,i)=>{ const ext=it.kind==='photo'?'jpg':(it.blob.type.includes('webm')?'webm':'mp4');
      return new File([it.blob],(it.kind==='photo'?'IMG_':'MOV_')+stamp()+'_'+(i+1)+'.'+ext,{type:it.blob.type||'application/octet-stream'}); });
    if(navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files}); return true; }catch(e){ if(e?.name==='AbortError') return true; }
    }
    return false;
  }
  $('vSave').onclick=async()=>{ if(!(await share([items[current]]))) toast('写真を長押しして保存してください'); };
  $('saveAll').onclick=async()=>{ if(!(await share(items))) toast('1つずつ開いて保存してください'); };

  // ---------- lifecycle ----------
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden' && body.classList.contains('recording')) stopRec();
    if(document.visibilityState==='visible' && (!stream || stream.getVideoTracks().every(t=>t.readyState==='ended'))) start();
  });
  window.addEventListener('beforeunload',e=>{ if(items.length){ e.preventDefault(); e.returnValue=''; } });

  // iOS 26 のホーム画面アプリは表示範囲が画面より短く報告され下に黒帯が出るため、実際の画面の高さで描く
  function fitHeight(){
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    let h = window.innerHeight;
    if (standalone && window.innerHeight >= window.innerWidth) h = Math.max(screen.height, screen.width); // 実際の画面の高さだけを使う
    document.documentElement.style.setProperty('--appH', h+'px');
    window.scrollTo(0,0);
  }
  fitHeight();
  window.addEventListener('resize', fitHeight);
  window.addEventListener('orientationchange', ()=>setTimeout(fitHeight,300));

  // ---------- 本体の向き（縦向きロックのまま、傾きでボタンの向きと写真の向きを変える） ----------
  let rot=0, motionAsked=false, sign=0;
  function applyRot(){
    const sel='#tools button svg, #zooms button, #thumb, #flip svg';
    document.querySelectorAll(sel).forEach(el=>{ el.classList.add('rotg'); el.style.transform = rot ? 'rotate('+rot+'deg)' : ''; });
  }
  function onMotion(e){
    const g=e.accelerationIncludingGravity; if(!g||g.x==null) return;
    // 機種によって符号が逆なので、最初に縦に持っているときの値で向きを覚える
    if (sign===0 && Math.abs(g.y)>8 && Math.abs(g.x)<3) sign = g.y<0 ? 1 : -1;
    const k = sign||1, ax=g.x*k, ay=g.y*k; let r=rot;
    if (Math.abs(ax)>6 && Math.abs(ax)>Math.abs(ay)+2) r = ax<0 ? 90 : -90;
    else if (ay<-6 && Math.abs(ay)>Math.abs(ax)+2) r = 0;
    if (r!==rot){ rot=r; applyRot(); }
  }
  let motionOn=false, gotMotion=false, deniedShown=false;
  function listen(){
    if (motionOn) return; motionOn=true;
    window.addEventListener('devicemotion', e=>{ gotMotion=true; onMotion(e); });
    setTimeout(()=>{ if(!gotMotion) toast('傾きセンサーの値を取得できません'); }, 2500);
  }
  function enableMotion(){
    if (motionOn) return;
    const D=window.DeviceMotionEvent;
    if (!D){ return; }
    if (typeof D.requestPermission==='function'){
      D.requestPermission().then(st=>{
        if (st==='granted') listen();
        else if (!deniedShown){ deniedShown=true; toast('「動作と方向」が許可されていないため横向きにできません'); }
      }).catch(()=>{});
    } else listen();
  }
  // iPhoneでは傾きセンサーの許可にタップが必要。許可されるまで、タップのたびに求める
  document.addEventListener('touchend', enableMotion);
  document.addEventListener('click', enableMotion);
  // ズームボタンは作り直されるので向きを再適用
  new MutationObserver(applyRot).observe(document.getElementById('zooms'),{childList:true});

  // ページ全体が動かないように（写真一覧のスクロールは許可）
  document.addEventListener('touchmove', e=>{ if(!e.target.closest('#lib')) e.preventDefault(); }, {passive:false});
  window.addEventListener('scroll', ()=>{ if(window.scrollY) window.scrollTo(0,0); });

  start();
})();
</script>
</body>
</html>
